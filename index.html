<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mather Al-lihyani</title>
<meta name="description" content="Software Engineering student focused on full-stack development, AI and UI/UX.">
<meta property="og:title" content="Mather Al-lihyani | Software Engineering Student">
<meta property="og:description" content="Full-stack development, AI and UI/UX. See my work and get in touch.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F1E33">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230F1E33%22/><text x=%2232%22 y=%2244%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22%23B8945B%22 font-family=%22Georgia%22>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<!-- إذا شاف الزائر شاشة الترحيب في هذه الجلسة، نخفيها مباشرة بدون وميض -->
<script>try{if(sessionStorage.getItem("seen"))document.documentElement.classList.add("no-splash")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- شاشة الترحيب: تظهر أول ما يفتح الزائر الموقع (ثلاث ثواني تقريباً) ثم تنزاح للأعلى. الضغط عليها يتخطاها -->
<div class="splash" id="splash" aria-hidden="true">
  <p class="splash-hi" data-i18n="splash_hi"></p>
  <p class="splash-name" data-i18n="name"></p>
  <div class="splash-line"></div>
</div>
<a class="skip" href="#top" data-i18n="skip"></a>
<!-- الشريط العلوي: الروابط وزر اللغة وزر الوضع -->
<header class="nav">
  <a class="logo" href="#top">M.A</a>
  <nav aria-label="Main">
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#skills" data-i18n="nav_skills"></a>
    <a href="#projects" data-i18n="nav_projects"></a>
    <a href="#journey" data-i18n="nav_journey"></a>
    <a href="#contact" data-i18n="nav_contact"></a>
  </nav>
  <div class="tools">
    <button id="lang" type="button" aria-label="Language"></button>
    <button id="theme" type="button" aria-label="Theme"></button>
  </div>
</header>

<main id="top">
  <!-- القسم الأول: الاسم والصورة. النصوص تجي من script.js عبر data-i18n -->
  <section class="hero wrap">
    <div class="hero-text">
      <p class="badge" data-i18n="badge"></p>
      <p class="role"><span id="typed"></span><span class="caret"></span></p>
      <h1 data-i18n="name"></h1>
      <p class="lead" data-i18n="tagline"></p>
      <div class="actions">
        <a class="btn primary" href="#projects" data-i18n="cta_work"></a>
        <a class="btn" href="#contact" data-i18n="cta_contact"></a>
        <!-- زر السيرة الذاتية: يظهر فقط إذا حطيتي مسار الملف في CV_FILE داخل script.js -->
        <a class="btn" id="cvBtn" hidden download data-i18n="btn_cv"></a>
      </div>
    </div>
    <div class="avatar" data-initials="MA">
      <!-- ضع صورتك هنا: images/profile.jpg -->
      <img src="images/profile.jpg" alt="Mather Al-lihyani" onload="this.parentElement.classList.add('has-photo')" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='profile.jpg'}else{this.remove()}">
    </div>
  </section>

  <!-- نبذة عني -->
  <section id="about" class="wrap sec">
    <h2 data-i18n="h_about"></h2>
    <p class="about" data-i18n="about"></p>
  </section>

  <!-- المهارات: تتعبأ من script.js -->
  <section id="skills" class="wrap sec">
    <h2 data-i18n="h_skills"></h2>
    <div class="cols">
      <div><h3 data-i18n="h_tech"></h3><ul class="chips" id="tech"></ul></div>
      <div><h3 data-i18n="h_soft"></h3><ul class="chips" id="soft"></ul></div>
    </div>
  </section>

  <!-- المشاريع: البطاقة تتعبأ من script.js -->
  <section id="projects" class="wrap sec">
    <h2 data-i18n="h_projects"></h2>
    <article class="card" id="project"></article>
  </section>

  <!-- المسيرة والشهادات -->
  <section id="journey" class="wrap sec">
    <h2 data-i18n="h_journey"></h2>
    <div class="timeline" id="journeyList"></div>
    <h3 class="sub" data-i18n="h_certs"></h3>
    <div class="timeline" id="certList"></div>
  </section>

  <!-- التواصل: أزرار بدون عرض الروابط -->
  <section id="contact" class="wrap sec">
    <h2 data-i18n="h_contact"></h2>
    <div class="contact" id="contactList"></div>
  </section>
</main>

<footer class="wrap foot"><span data-i18n="footer"></span></footer>
<!-- ملف المحتوى والتفاعل -->
<script src="script.js"></script>
</body>
</html>
